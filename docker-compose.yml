services:
  bot:
    build: .
    image: discord-scan-bot
    container_name: discord-scan-bot
    env_file:
      - .env
    restart: unless-stopped
    cap_add:
      - NET_RAW
      - NET_ADMIN
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    volumes:
      - scan-results:/tmp/scan-bot

volumes:
  scan-results:
